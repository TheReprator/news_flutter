name: news_flutter
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish 
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  window_size:
    git:
      url: https://github.com/google/flutter-desktop-embedding
      path: plugins/window_size

  floor: ^1.5.0

  #networking
  chopper: ^8.1.0
  logger: any  #for logging purpose
  built_value: ^8.9.2

  # state management
  flutter_bloc: ^9.1.1

  #service locater
  get_it: ^8.0.3
  injectable: ^2.5.0

  #for equality and immutability
  freezed_annotation: ^3.1.0

   #navigation
  go_router: ^16.0.0

  connectivity_plus: ^6.1.4
  
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.9
  chopper_generator: ^8.1.0

  injectable_generator: ^2.7.0

  freezed: ^3.1.0
  freezed_annotation: ^3.1.0

  test: ^1.25.7
  bloc_test: ^10.0.0
  build_test: ^3.2.1
  mocktail: ^1.0.4

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true